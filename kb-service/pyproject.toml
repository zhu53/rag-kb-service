[project]
name = "kb-service"
version = "0.1.0"
description = "渐进式练习项目：企业级 RAG 知识库服务（学习用脚手架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
    "pre-commit>=4.0",
]

# 阶段解锁的依赖（到对应周次再取消注释）
# W7 数据库
# "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2", "asyncpg>=0.30"
# W10 缓存
# "redis>=5.2"
# W11 异步任务
# "celery[redis]>=5.4", "pypdf>=5.1"
# W12 向量检索
# "pgvector>=0.3.6", "openai>=1.57"
# W13 可观测
# "prometheus-fastapi-instrumentator>=7.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "B008",    # FastAPI Depends() 默认参数是官方用法
    # 中文注释/docstring 里用全角标点（，：（））是正常需求。
    # 这三条规则会把它们判成「有歧义字符」，对中文项目是纯噪音。
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["src/kb_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
