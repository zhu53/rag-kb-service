name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kb-service

    steps:
      - uses: actions/checkout@v4

      # 从 PyPI 装 uv，而不是 setup-uv 从 GitHub Releases 下 tar.gz。
      # 两次教训（2026-11-09）：
      #   1) latest(0.13.7) 下载时 GitHub 网关连甩 504，失败在装工具这步，项目代码一行没跑；
      #   2) 钉成 0.13.2 后同一个 step 又失败（3m45s，重试耗尽）——说明不是版本问题，
      #      是 "github.com/.../releases/download" 这条通路本身在 runner 上不稳定。
      # 关键理由：uv sync 本来就要访问 pypi.org，多一条依赖 GitHub Releases 的通路毫无必要。
      # 只留一条通路 = 少一个会独立挂掉的外部依赖。
      - name: Install uv (from PyPI)
        run: |
          # ubuntu-latest 的系统 python 带 PEP 668 保护（externally-managed-environment），
          # 直接 pip install 会被拒；建个临时 venv 装，再把 bin 塞进 GITHUB_PATH 给后续 step 用。
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install --quiet --retries 5 --timeout 60 "uv==0.13.2"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-venv/bin/uv" --version

      # setup-uv 的 enable-cache 就是这个缓存的封装，换成显式 actions/cache：
      # key 挂 uv.lock 的哈希，lock 不变就复用整个 wheel 缓存。
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('kb-service/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync dependencies
        run: uv sync --dev

      # 排查用：把平台和关键工具版本固化进日志。
      # "本地绿、CI 红"的案子，第一步永远是先确认两边到底哪里不一样。
      - name: Environment
        run: |
          uv --version
          uv run python -V
          uv run python -c "import platform, sys; print(platform.platform()); print(sys.version)"

      # 本地是一条命令（scripts/check.py），CI 这里是分步的——不是重复劳动。
      # 门禁是一条命令时，红了只知道"红了"；分步之后，"哪一层红"由 step 名字直接给出。
      #
      # 失败信息统一用 tail 折成【一条】多行注解（%0A 是 workflow command 的换行转义）。
      # 一行一条 echo 的写法踩过坑：GitHub 每个 check run 只展示前 10 条 failure 注解，
      # 而 Python 的 import 链正好 10 层，结果最关键的 "E ImportError: ..." 被挤没了。

      - name: ruff check
        run: |
          set -o pipefail
          uv run python -m ruff check src tests scripts conftest.py 2>&1 | tee /tmp/step.log || {
            MSG=$(tail -30 /tmp/step.log | sed -e 's/\r$//' -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=ruff check failed::${MSG}"
            exit 1
          }

      - name: ruff format --check
        run: |
          set -o pipefail
          uv run python -m ruff format --check src tests scripts conftest.py 2>&1 | tee /tmp/step.log || {
            MSG=$(tail -30 /tmp/step.log | sed -e 's/\r$//' -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=ruff format failed::${MSG}"
            exit 1
          }
      - name: mypy
        run: |
          set -o pipefail
          uv run python -m mypy src tests scripts conftest.py 2>&1 | tee /tmp/step.log || {
            MSG=$(tail -30 /tmp/step.log | sed -e 's/\r$//' -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=mypy failed::${MSG}"
            exit 1
          }

      - name: pytest + coverage
        run: |
          set -o pipefail
          uv run python -m pytest --cov --cov-report=term-missing --cov-fail-under=95 2>&1 | tee /tmp/step.log || {
            MSG=$(tail -60 /tmp/step.log | sed -e 's/\r$//' -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=pytest failed::${MSG}"
            exit 1
          }

      # 只在前面失败时才跑：绕开 pytest，直接 import，让异常自己说人话。
      # pytest 会把 import 期异常包成 "ImportError while loading conftest"，
      # 真正的原因（缺哪个模块 / 版本不兼容）藏在最后一行的 E 后面。
      - name: Diagnose import failure
        if: failure()
        run: |
          {
            echo "--- python / 依赖版本 ---"
            uv run python -V 2>&1 || true
            uv run python -c "import passlib; print('passlib', passlib.__version__)" 2>&1 | tail -5 || true
            uv run python -c "import bcrypt; print('bcrypt', bcrypt.__version__)" 2>&1 | tail -5 || true
            echo "--- passlib.utils.decor 里到底有没有 deprecated_method ---"
            uv run python -c "import passlib.utils.decor as d; print([n for n in dir(d) if 'deprecat' in n])" 2>&1 | tail -5 || true
            echo "--- 直接 import CryptContext（不经过 pytest） ---"
            uv run python -c "from passlib.context import CryptContext; print('CryptContext ok')" 2>&1 | tail -20 || true
          } > /tmp/diag.log 2>&1
          MSG=$(sed -e 's/\r$//' -e 's/%/%25/g' /tmp/diag.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          echo "::error title=diagnose::${MSG}"

      - name: mutation
        run: |
          set -o pipefail
          uv run python scripts/mutation_check.py 2>&1 | tee /tmp/step.log || {
            MSG=$(tail -30 /tmp/step.log | sed -e 's/\r$//' -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=mutation failed::${MSG}"
            exit 1
          }
