name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kb-service

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev

      # CI 不写任何新逻辑：本地跑什么，这里就跑什么
      - name: Quality gate
        run: uv run python scripts/check.py --mutation
