# 仓库根 ruff 配置：只服务 recommendations/ 这类"仓库根下的 Python 文件"
#
# 为什么需要这个文件：ruff 从被检查文件向上找最近的配置。
#   - kb-service/**   → 用 kb-service/pyproject.toml（那边是权威配置）
#   - reviews/**      → 根目录原本没有配置，会用 ruff 默认规则（88 列 + 只查 E4/E7/E9/F）
#                       等于 reviews 和项目代码被两套标准检查，这一点很隐蔽。
#
# extend 让 reviews 直接继承项目配置，规则只有一份来源，不会漂移。
extend = "kb-service/pyproject.toml"

# 覆盖 kb-service 里的 src 路径。
#
# 这一步是必须的，而且原因很隐蔽：ruff 的 src 是**相对配置文件所在目录**解析的。
#   - 检查 kb-service/** 时，配置是 kb-service/pyproject.toml，src=["src","tests"] → 指向 kb-service/src
#   - 检查 reviews/**    时，配置是根 ruff.toml，若写成 src=["."] → 指向仓库根
# 两者指向不同目录，isort 对 "kb_service 属于第一方还是第三方" 的判断就会不一致。
#
# 症状：一次传入 src + reviews 两个路径时，明明没改过的 tests/conftest.py
#       会突然报 I001（import 分组错）。因为 project root 上移了，判定基准变了。
#
# 解法：让根配置的 src 指向**与 kb-service 相同**的物理目录，判定就一致了。
src = ["kb-service/src", "kb-service/tests"]

# 排除 progress/：教学材料目录，禁止被 ruff 碰。
#
# 事故记录（2026-11-12）：在仓库根误跑 `ruff format .`，把 progress/ 下
# 57 个 .md 里的 Python 代码块和 20 个练习/探针 .py 全部重排——
# 教材正文是逐行解读这些代码块的，格式一变，行号和片段引用全部错位，
# 而教材本身不可执行，改坏了没有任何测试能报警。
#
# 所以这里硬性排除：progress/ 是**只读的档案**，不是代码源。
# 需要格式化练习代码时，单独指定文件：ruff format progress/week3/kbcli/src
extend-exclude = ["progress"]
