# pre-commit 钩子配置
# 位置：仓库根（python-backend-roadmap/），不是 kb-service/ 里
# 原因：git hooks 只认仓库根，kb-service 是子目录
#
# 安装：在仓库根执行
#   cd kb-service && uv run pre-commit install --config ../.pre-commit-config.yaml
# 手动全量跑一次：
#   cd kb-service && uv run pre-commit run --all-files --config ../.pre-commit-config.yaml

repos:
  # ---- ruff：lint + 格式化 ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 kb-service/.venv 里的 ruff 0.17.1 保持一致，避免 hook 和本地规则打架
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^kb-service/
      - id: ruff-format
        files: ^kb-service/

  # ---- 通用卫生检查（不依赖 Python）----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace        # 去掉行尾空格
        exclude: \.md$
      - id: end-of-file-fixer          # 文件末尾补换行
      - id: check-yaml                 # YAML 语法检查
      - id: check-toml                 # TOML 语法检查
      - id: check-added-large-files    # 拦住误提交的大文件
        args: [--maxkb=1024]
      - id: check-merge-conflict       # 拦住没解决的冲突标记 <<<<<<<
      - id: detect-private-key         # 拦住误提交的私钥
